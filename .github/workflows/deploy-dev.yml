name: Deploy TEST Frontend

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy TEST via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/axiofront-test
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
            git clean -fd

            npm ci
            npm run build

            systemctl restart axiofront-test
