name: Deploy PROD Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PROD via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            cd /opt/axiofront

            git fetch origin
            git checkout main
            git reset --hard origin/main
            git clean -fd

            npm ci
            npm run build

            systemctl restart axiofront
            systemctl is-active --quiet axiofront

            curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null
