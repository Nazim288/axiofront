name: Deploy PROD Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy PROD via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e

            cd /opt/axiofront

            git fetch origin
            git checkout main
            git reset --hard origin/main
            git clean -fd

            npm ci
            npm run build

            systemctl restart axiofront
            systemctl is-active --quiet axiofront

            for i in {1..30}; do
              if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
                echo "Production frontend is ready"
                exit 0
              fi

              echo "Waiting for production frontend... attempt $i/30"
              sleep 2
            done

            echo "Production frontend failed to start"
            systemctl status axiofront --no-pager
            journalctl -u axiofront -n 100 --no-pager
            exit 1
